# Taeglicher Lauf (D2): Daten holen, Dashboard exportieren, Hinweise verschicken, Seite auf GitHub Pages
# veroeffentlichen. Kostenlos im Rahmen von GitHub Actions und Pages. Zustand (Tagesbilder, Ereignisse) liegt
# in data/state.json und wird nach jedem Lauf zurueckgeschrieben.
name: MacroPilot taeglich

on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC = 07:40 MESZ, nach den Fed-Daten vom Vorabend
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macropilot-daily
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend installieren
        run: pip install -r backend/requirements.txt
      # Der Rohdaten-Cache liegt in backend/data und gehoert bewusst nicht ins Repository: 2 MB pro Tag waeren
      # zu viel Git-Historie. Ohne ihn startet jeder Lauf kalt, und dann reisst ein einzelner Quellen-Ausfall den
      # ganzen Export mit, weil der Rueckfall auf den Vortageswert nur greift, wenn eine Kopie da ist. Genau das
      # ist am 18.09.2026 passiert: Die Treasury-API lief in einen Timeout, lokal mit warmem Cache lief derselbe
      # Export durch. restore-keys holt den zuletzt gesicherten Stand, auch wenn der Schluessel nicht exakt passt.
      - name: Rohdaten-Cache wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: macropilot-rohdaten-${{ github.run_id }}
          restore-keys: macropilot-rohdaten-
      - name: Export (Refresh, Tagesbild, Hinweise, JSON)
        working-directory: backend
        # Bei einem Fehler landet das Ende der Ausgabe in der Zusammenfassung des Laufs (ohne Login lesbar).
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          EXPLAIN_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'template' }}
          AUTO_REFRESH: "false"
          DATA_DIR: ${{ github.workspace }}/backend/data
        run: |
          set -o pipefail
          python -m app.export --out ../frontend/public/data --state ../data/state.json 2>&1 | tee export.log || { echo "## Export fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 export.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          grep -E "^(Refresh|Kanaele|Export)" export.log >> "$GITHUB_STEP_SUMMARY" || true
      # Auch nach einem Fehlschlag sichern: Was erfolgreich geholt wurde, hilft dem naechsten Lauf.
      - name: Rohdaten-Cache sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: macropilot-rohdaten-${{ github.run_id }}
      - name: Zustand sichern
        run: |
          git config user.name "macropilot-bot"
          git config user.email "macropilot-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Tagesbild $(date -u +%F)"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Node 22 bringt npm 10 mit. Die Lock-Datei entsteht lokal mit npm 11, und npm 10 verlangt Eintraege
      # (@emnapi/core, @emnapi/runtime unter den wasm32-Fallbacks), die npm 11 nicht mehr schreibt: "npm ci"
      # meldet dann "not in sync". Deshalb hier dieselbe npm-Hauptversion wie lokal.
      - name: npm auf Version 11 festnageln (wie lokal)
        run: npm install -g npm@11 && npm --version
      - name: Frontend statisch bauen
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_MODE: static
          NEXT_PUBLIC_DATA_URL: /data
          BASE_PATH_VAR: ${{ vars.BASE_PATH }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          # Eine Projektseite liegt unter <nutzer>.github.io/<repo>/. Ohne diesen Praefix zeigen alle Asset- und
          # Datenpfade auf den Domain-Root und laufen ins Leere (HTML laedt, CSS/JS/JSON antworten mit 404).
          # Nur die Nutzerseite <nutzer>.github.io selbst braucht keinen Praefix. Die Repository-Variable
          # BASE_PATH ueberschreibt die Herleitung; "/" oder "none" bedeutet ausdruecklich kein Praefix
          # (eigene Domain). Die Datenadresse bekommt den Praefix in src/lib/api.ts, deshalb bleibt sie /data.
          repo="${GITHUB_REPOSITORY#*/}"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          base="$BASE_PATH_VAR"
          if [ -z "$base" ] && [ "$(lower "$repo")" != "$(lower "$GITHUB_REPOSITORY_OWNER").github.io" ]; then
            base="/$repo"
          fi
          case "$base" in /|none|NONE) base="" ;; esac
          export NEXT_PUBLIC_BASE_PATH="$base"
          echo "BASE_PATH='${NEXT_PUBLIC_BASE_PATH}' (Variable: '${BASE_PATH_VAR}') Node $(node --version) npm $(npm --version)"
          npm ci --no-audit --no-fund 2>&1 | tee install.log || {
            echo "## npm ci fehlgeschlagen, Rueckfall auf npm install (Lock-Datei lokal mit derselben npm-Version neu erzeugen)" >> "$GITHUB_STEP_SUMMARY"
            tail -20 install.log >> "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund 2>&1 | tee install.log || { tail -40 install.log >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          }
          npm run build 2>&1 | tee build.log || { echo "## next build fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -80 build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          test -f .next-static/index.html || { echo "## Export fehlt: .next-static/index.html nicht gefunden" >> "$GITHUB_STEP_SUMMARY"; ls -la >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # Abnahme: mit Praefix darf keine Asset-Adresse mehr auf dem Domain-Root stehen, sonst laedt die
          # Seite zwar, bleibt aber ohne Stil, ohne Skripte und ohne Daten.
          if [ -n "$NEXT_PUBLIC_BASE_PATH" ] && grep -q '"/_next/' .next-static/index.html; then
            echo "## Basispfad nicht angewandt: index.html verweist auf /_next statt auf ${NEXT_PUBLIC_BASE_PATH}/_next" >> "$GITHUB_STEP_SUMMARY"
            grep -o '"/_next/[^"]*"' .next-static/index.html | head -5 >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test -f .next-static/data/dashboard.json || { echo "## Daten fehlen im Export: .next-static/data/dashboard.json" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          touch .next-static/.nojekyll
          echo "## Frontend gebaut: $(find .next-static -type f | wc -l) Dateien" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.next-static

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
