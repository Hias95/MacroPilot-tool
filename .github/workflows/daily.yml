# Taeglicher Lauf (D2): Daten holen, Dashboard exportieren, Hinweise verschicken, Seite auf GitHub Pages
# veroeffentlichen. Kostenlos im Rahmen von GitHub Actions und Pages. Zustand (Tagesbilder, Ereignisse) liegt
# in data/state.json und wird nach jedem Lauf zurueckgeschrieben.
name: MacroPilot taeglich

on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC = 07:40 MESZ, nach den Fed-Daten vom Vorabend
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macropilot-daily
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend installieren
        run: pip install -r backend/requirements.txt
      - name: Export (Refresh, Tagesbild, Hinweise, JSON)
        working-directory: backend
        # Bei einem Fehler landet das Ende der Ausgabe in der Zusammenfassung des Laufs (ohne Login lesbar).
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          EXPLAIN_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'template' }}
          AUTO_REFRESH: "false"
          DATA_DIR: ${{ github.workspace }}/backend/data
        run: |
          set -o pipefail
          python -m app.export --out ../frontend/public/data --state ../data/state.json 2>&1 | tee export.log || { echo "## Export fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 export.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          grep -E "^(Refresh|Export)" export.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Zustand sichern
        run: |
          git config user.name "macropilot-bot"
          git config user.email "macropilot-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Tagesbild $(date -u +%F)"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend statisch bauen
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_MODE: static
          NEXT_PUBLIC_DATA_URL: /data
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -o pipefail
          echo "BASE_PATH='${NEXT_PUBLIC_BASE_PATH}' Node $(node --version) npm $(npm --version)"
          npm ci --no-audit --no-fund 2>&1 | tee install.log || { echo "## npm ci fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"; tail -40 install.log >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          npm run build 2>&1 | tee build.log || { echo "## next build fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -80 build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          test -f .next-static/index.html || { echo "## Export fehlt: .next-static/index.html nicht gefunden" >> "$GITHUB_STEP_SUMMARY"; ls -la >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          touch .next-static/.nojekyll
          echo "## Frontend gebaut: $(find .next-static -type f | wc -l) Dateien" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.next-static

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
